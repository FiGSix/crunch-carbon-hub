<style>
  .flow-diagram {
    font-family: var(--font-sans), system-ui, sans-serif;
  }
  .flow-diagram .box {
    fill: var(--bg-secondary);
    stroke: var(--border-translucent);
    stroke-width: 1;
    rx: 8;
  }
  .flow-diagram .box-label {
    fill: var(--fg-primary);
    font-size: 14px;
    font-weight: 600;
    text-anchor: middle;
  }
  .flow-diagram .box-note {
    fill: var(--fg-secondary);
    font-size: 12px;
    text-anchor: middle;
  }
  .flow-diagram .accent-box {
    fill: var(--bg-accent-translucent);
    stroke: var(--bg-accent);
    stroke-width: 1.5;
  }
  .flow-diagram .wire {
    stroke: var(--fg-secondary);
    stroke-width: 1.5;
    fill: none;
    marker-end: url(#arrow);
  }
  .flow-diagram .zone {
    fill: none;
    stroke: var(--border-translucent);
    stroke-width: 1;
    stroke-dasharray: 4 3;
    rx: 12;
  }
  .flow-diagram .zone-label {
    fill: var(--fg-secondary);
    font-size: 12px;
    text-transform: lowercase;
  }
</style>

<svg viewBox="0 0 640 480" class="flow-diagram" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fg-secondary)"/>
    </marker>
  </defs>

  <!-- Public estimate zone -->
  <rect x="20" y="20" width="280" height="440" class="zone"/>
  <text x="40" y="44" class="zone-label">public estimate</text>

  <!-- Hero -->
  <rect x="50" y="60" width="220" height="50" class="box accent-box"/>
  <text x="160" y="85" class="box-label">Your solar. A little more possibility.</text>
  <text x="160" y="100" class="box-note">Hero + SEO metadata preserved</text>

  <!-- System input -->
  <rect x="50" y="130" width="220" height="70" class="box"/>
  <text x="160" y="155" class="box-label">System input</text>
  <text x="160" y="172" class="box-note">Home / Business • kWp / MWp</text>
  <text x="160" y="188" class="box-note">Province • Commissioning date</text>

  <!-- Headline result -->
  <rect x="50" y="220" width="220" height="60" class="box accent-box"/>
  <text x="160" y="245" class="box-label">Headline estimate</text>
  <text x="160" y="262" class="box-note">Annual income + key impact stats</text>
  <text x="160" y="278" class="box-note">No email required</text>

  <!-- Gated detail zone -->
  <rect x="320" y="20" width="300" height="440" class="zone"/>
  <text x="340" y="44" class="zone-label">unlocked after email</text>

  <!-- Email gate -->
  <rect x="350" y="60" width="240" height="50" class="box"/>
  <text x="470" y="85" class="box-label">Email gate</text>
  <text x="470" y="100" class="box-note">Name + email to unlock forecast</text>

  <!-- Full forecast -->
  <rect x="350" y="130" width="240" height="60" class="box accent-box"/>
  <text x="470" y="155" class="box-label">Full forecast</text>
  <text x="470" y="172" class="box-note">Year-by-year revenue to 2030</text>
  <text x="470" y="188" class="box-note">Province yield + real share tier</text>

  <!-- Proposal preview -->
  <rect x="350" y="210" width="240" height="60" class="box"/>
  <text x="470" y="235" class="box-label">Proposal preview</text>
  <text x="470" y="252" class="box-note">Personalised document card</text>
  <text x="470" y="268" class="box-note">Saved client + proposal created</text>

  <!-- Existing handoff -->
  <rect x="350" y="290" width="240" height="60" class="box accent-box"/>
  <text x="470" y="315" class="box-label">Sign & onboard</text>
  <text x="470" y="332" class="box-note">Existing proposal acceptance</text>
  <text x="470" y="348" class="box-note">Cession agreement → Onboarding</text>

  <!-- How it works -->
  <rect x="50" y="310" width="220" height="80" class="box"/>
  <text x="160" y="335" class="box-label">How it works</text>
  <text x="160" y="352" class="box-note">1. Discover 2. Propose 3. Sign 4. Onboard</text>
  <text x="160" y="368" class="box-note">Sets expectation before signup</text>

  <!-- Wires -->
  <line x1="160" y1="110" x2="160" y2="130" class="wire"/>
  <line x1="160" y1="200" x2="160" y2="220" class="wire"/>
  <line x1="270" y1="250" x2="350" y2="85" class="wire"/>
  <line x1="470" y1="110" x2="470" y2="130" class="wire"/>
  <line x1="470" y1="190" x2="470" y2="210" class="wire"/>
  <line x1="470" y1="270" x2="470" y2="290" class="wire"/>
  <line x1="160" y1="280" x2="160" y2="310" class="wire"/>
</svg>
